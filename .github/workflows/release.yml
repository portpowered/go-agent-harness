name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # CoreAudio and AUVoiceIO are CGO-backed. Run the release on macOS so the
    # darwin artifacts can be native while Go still cross-compiles the portable
    # Linux and Windows artifacts with CGO disabled.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
