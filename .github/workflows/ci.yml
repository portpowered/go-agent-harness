name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Static checks run as parallel shards; `static` below aggregates them under
  # the required "CI (static)" check name. Every shard must finish within the
  # three-minute budget even when its build cache is cold (first main run
  # after a toolchain or cache-key change, or an evicted cache), which is what
  # sets the lane sizes below. Each check step runs with `if: always()` so an
  # early failure does not hide later results in the same shard.
  #
  # go vet and standalone staticcheck do not run here: golangci-lint's
  # standard linters (govet with the go vet analyzer set, staticcheck with
  # every SA/S/ST/QF check staticcheck enables by default, and unused)
  # enforce them on every lint lane. See docs/architecture/lint-policy.md.
  #
  # Every shard restores its own Go build, module and golangci-lint caches
  # through .github/actions/go-cache. golangci-lint and the architecture gate
  # load dependencies from compiled export data, so the build cache is what
  # keeps these jobs short. The checkouts skip docs/temp like the test jobs.
  static-gates:
    name: CI (static gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: static-gates

      - name: Run gofmt check
        if: always()
        run: make fmt

      - name: Verify generated service composition
        if: always()
        run: make wire-check

      - name: Verify CI test partition
        if: always()
        run: make check-ci-test-partition

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The architecture gate type-loads every module from compiled export data,
  # so it keeps its own build cache instead of adding its cold compile to the
  # gates job. It needs full history for the baseline merge-base check.
  static-architecture:
    name: CI (static architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: static-architecture

      - name: Verify service architecture and size budgets
        run: make architecture-size-check

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # golangci-lint lanes. Every lane enforces the hard limits in .golangci.yml
  # (which also loads the opt-in live/e2e/e2e_internal/stress/
  # sessioncapacityramp test tags). The linux lanes add the new-code pass and
  # the wireinject pass; the windows and darwin lanes lint with cgo disabled
  # (darwin also with the nomicrophone tag), and the darwin cgo lane lints
  # cgo-constrained packages natively on macOS. See
  # docs/architecture/lint-policy.md.
  static-lint:
    name: CI (static lint ${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux agent-cli
            cache: static-lint-linux-agent-cli
            runner: ubuntu-latest
            fetch-depth: 0
            command: make lint LINT_SHARD=agent-cli
          - lane: linux runtime
            cache: static-lint-linux-runtime
            runner: ubuntu-latest
            fetch-depth: 0
            command: make lint LINT_SHARD=runtime
          - lane: linux support
            cache: static-lint-linux-support
            runner: ubuntu-latest
            fetch-depth: 0
            command: make lint LINT_SHARD=support
          - lane: windows agent-cli
            cache: static-lint-windows-agent-cli
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=agent-cli
          - lane: windows runtime
            cache: static-lint-windows-runtime
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=runtime
          - lane: windows support
            cache: static-lint-windows-support
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=support
          - lane: darwin agent-cli
            cache: static-lint-darwin-agent-cli
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=agent-cli
          - lane: darwin runtime
            cache: static-lint-darwin-runtime
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=runtime
          - lane: darwin support
            cache: static-lint-darwin-support
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=support
          # cgo-constrained darwin files (CoreAudio capture, display
          # permission) need the macOS SDK.
          - lane: darwin cgo
            cache: static-lint-darwin-cgo
            runner: macos-14
            fetch-depth: 1
            command: make lint-darwin-cgo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: ${{ matrix.cache }}
          extra-paths: ${{ runner.temp }}/golangci-lint

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Run golangci-lint
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: ${{ matrix.command }}

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
          extra-paths: ${{ runner.temp }}/golangci-lint

  # Preserve the required "CI (static)" check name while aggregating the
  # parallel static shards. `always()` reports a failed shard as a failed
  # check rather than leaving it skipped.
  static:
    name: CI (static)
    needs:
      - static-gates
      - static-architecture
      - static-lint
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify static shards completed
        env:
          GATES_RESULT: ${{ needs.static-gates.result }}
          ARCHITECTURE_RESULT: ${{ needs.static-architecture.result }}
          LINT_RESULT: ${{ needs.static-lint.result }}
        run: |
          test "$GATES_RESULT" = success
          test "$ARCHITECTURE_RESULT" = success
          test "$LINT_RESULT" = success

  # Fast unit-level checks and the agent-cli link gate. No analyzer binaries
  # needed. Library packages are not compiled here: the coverage libraries
  # shard compiles every one of them.
  unit:
    name: CI (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: unit

      - name: Run repository helper module tests
        if: always()
        run: make test-tools

      - name: Run factory script tests
        if: always()
        run: make test-factory-scripts

      - name: Build agent-cli binaries
        if: always()
        run: make build BUILD_LIBRARY_PACKAGES=0

      - name: Verify standalone checkout dependency graph
        if: always()
        run: scripts/verify-standalone-checkout.sh

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The Linux package corpus has one owner: coverage, as three disjoint jobs
  # that run concurrently. agent-cli is isolated because its deterministic
  # integration and replay tests are the long pole, and split into every
  # package except test/integration (coverage agent-cli unit) and
  # test/integration (coverage); the other modules and the embedding consumer
  # share one runner (coverage libraries).
  #
  # The integration job compiles its coverage-instrumented test binary once
  # (building the helper binaries alongside) and runs
  # AGENT_CLI_INTEGRATION_SHARDS duration-balanced shards of its top-level
  # tests concurrently: the shards mostly wait on paced audio, so one runner
  # overlaps them instead of paying setup and a compile per shard.
  coverage-agent-cli-unit:
    name: CI (coverage agent-cli unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      # Each coverage job keeps its own build cache: the agent-cli test
      # binaries are built with coverage instrumentation, which setup-go's
      # shared cache (written once by whichever job finishes first) never
      # holds.
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-agent-cli-unit

      - name: Run hermetic agent-cli unit tests with coverage
        run: make coverage-ci-agent-cli AGENT_CLI_COVERAGE_SHARD=unit

      - name: Upload agent-cli coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-cli-unit
          path: coverage/agent-cli.out
          if-no-files-found: error
          retention-days: 1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The unit, coverage libraries, coverage, race and OS jobs skip docs/temp
  # (about 90% of the checkout's bytes; no Go package, helper-module or
  # factory-script test reads it): a blobless clone fetches only the sparse
  # tree's blobs.
  coverage-libraries:
    name: CI (coverage libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-libraries

      - name: Run hermetic library and embedding tests with coverage
        run: make coverage-ci-libraries

      - name: Upload library coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-libraries
          path: coverage/*.out
          if-no-files-found: error
          retention-days: 1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The required "CI (coverage)" check: the agent-cli integration shards, then
  # the coverage gate over every profile. The integration job is the longest
  # coverage job, so running the gate at its end (after waiting for the two
  # sibling coverage jobs, which fails if either failed) replaces a separate
  # `needs:` gate job that paid a runner start, checkout and Go setup after
  # the slowest shard. The gate does not run if the integration tests fail.
  coverage:
    name: CI (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches (and
    # lets ci-await-jobs read the sibling jobs).
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-agent-cli-integration

      - name: Run hermetic agent-cli integration tests with coverage
        run: make coverage-ci-agent-cli AGENT_CLI_COVERAGE_SHARD=integration

      - name: Wait for the other coverage jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-await-jobs.sh "CI (coverage agent-cli unit)" "CI (coverage libraries)"

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Run coverage gate
        run: make coverage-gate

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Focused race-detector acceptance tests. Kept together on one runner
  # (rather than split further) to avoid adding more concurrent
  # load-sensitive test processes across additional runners. Each target
  # race-compiles only the packages it runs tests from, and the Makefile sets
  # GORACE=atexit_sleep_ms=0 so no race test binary idles 1s at exit. The
  # Linux device step is also the only job that builds the native (cgo,
  # malgo) Linux device backend and its tests.
  race:
    name: CI (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: race

      - name: Run focused RTC race acceptance
        if: always()
        run: make test-rtc-race

      - name: Run audio stability race corpus
        if: always()
        run: make test-audio-stability-race

      - name: Run concurrent session capacity race acceptance
        if: always()
        run: make test-sessions-race

      - name: Run agent loop session, engine and participant race corpus
        if: always()
        run: make test-loop-race

      - name: Run native Linux device backend race tests
        if: always()
        run: make test-linux-devices-race

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # One macOS runner owns every macOS check: the arm64 agent build is shared
  # by the release inspection and the WebMCP proof, and the runner is set up
  # once. `webmcp-chrome` below keeps the required "CI (WebMCP Chrome)" check
  # name and reports the WebMCP step's own outcome.
  macos-audio-release:
    name: CI (macOS audio release)
    runs-on: macos-14
    timeout-minutes: 25
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write
    outputs:
      webmcp: ${{ steps.webmcp.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: macos

      - name: Run package-adjacent macOS audio units
        run: go test ./go-audio/... ./go-device-gateway/... -count=1

      - name: Compile functional physical-device suite
        run: go test ./agent-cli/test/functional -count=1

      - name: Cross-build and inspect native EAC release artifacts
        run: |
          # The two architectures share no build outputs; build them concurrently.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS='-arch arm64' CGO_LDFLAGS='-arch arm64' go build -o "$RUNNER_TEMP/agent-darwin-arm64" ./agent-cli/cmd/agent &
          arm64_build=$!
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS='-arch x86_64' CGO_LDFLAGS='-arch x86_64' go build -o "$RUNNER_TEMP/agent-darwin-amd64" ./agent-cli/cmd/agent &
          amd64_build=$!
          wait "$arm64_build"
          wait "$amd64_build"
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-arm64" darwin_arm64
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-amd64" darwin_amd64

      # `go run goreleaser@version` recompiled GoReleaser on every run
      # (100-130s); cache the pinned binary instead.
      - name: Cache pinned GoReleaser binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/goreleaser
          key: goreleaser-v2.17.0-go1.26.7-${{ runner.os }}-${{ runner.arch }}

      - name: Validate GoReleaser configuration
        run: |
          goreleaser_dir="$HOME/.cache/go-agent-harness/goreleaser"
          if [ ! -x "$goreleaser_dir/goreleaser" ]; then
            GOBIN="$goreleaser_dir" go install github.com/goreleaser/goreleaser/v2@v2.17.0
          fi
          "$goreleaser_dir/goreleaser" check --config .goreleaser.yaml

      # The locked WebMCP Chrome artifact is mac-arm64. Runs even when an
      # audio step failed so its required check always has a real outcome.
      - name: Run production-binary cross-process cancellation acceptance
        id: webmcp
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        working-directory: agent-cli
        env:
          WEBMCP_CLI_CHROME_INTEGRATION: "1"
        run: go test ./internal/webmcp/chrome -run '^TestWebMCPDirectCLIWithPinnedChromeCrossProcessCancel$' -count=1 -v

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Keep this behavioral check required alongside hermetic coverage so skipped
  # opt-in coverage cannot make a pull request appear complete. It runs on the
  # macOS audio release runner and reports that step's outcome here.
  webmcp-chrome:
    name: CI (WebMCP Chrome)
    needs: macos-audio-release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify WebMCP Chrome acceptance passed
        env:
          WEBMCP_RESULT: ${{ needs.macos-audio-release.outputs.webmcp }}
        run: test "$WEBMCP_RESULT" = success

  windows-audio-portable:
    name: CI (Windows audio portable)
    runs-on: windows-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: windows

      - name: Run Windows audio queue regressions
        run: go test ./go-audio/... ./go-device-gateway/... -run 'TestWindowsPortablePlaybackBurstPreservesFIFO|TestVirtualPlaybackCapacityAdversarial' -count=1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
