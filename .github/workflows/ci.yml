name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: Run focused RTC race acceptance
        run: make test-rtc-race

      - name: Run root CI pipeline
        run: make ci

  hermetic:
    name: CI (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run hermetic test pipeline
        run: make test-hermetic
