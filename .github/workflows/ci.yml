name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Static checks run as parallel shards so no shard exceeds the
  # three-minute test budget; `static` below aggregates them under the
  # required "CI (static)" check name. Each check step runs with
  # `if: always()` so an early failure does not hide later results in the
  # same shard.
  #
  # go vet and standalone staticcheck do not run here: golangci-lint's
  # standard linters (govet with the go vet analyzer set, staticcheck with
  # every SA/S/ST/QF check staticcheck enables by default, and unused)
  # enforce them on every lint lane. See docs/architecture/lint-policy.md.
  #
  # Every shard keeps its Go build cache (and golangci-lint's analysis cache)
  # in its own actions/cache entry. Package loading needs compiled export
  # data for every dependency, so a warm build cache is what keeps these jobs
  # short. main pushes save the entry after pruning it to the files this run
  # used; a pull request saves only when nothing could be restored.
  static-gates:
    name: CI (static gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATIC_CACHE_KEY: static-gates-go1.26.7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum
            go-audio/go.sum
            go-device-gateway/go.sum
            go-agent-runtime/go.sum
            tools/architecturegate/go.sum
            tests/embedding/go.sum

      - name: Restore static build cache
        id: static-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/static-go-build
          key: ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-

      - name: Run gofmt check
        if: always()
        run: make fmt

      - name: Verify generated service composition
        if: always()
        env:
          GOCACHE: ${{ runner.temp }}/static-go-build
        run: make wire-check

      - name: Verify CI test partition
        if: always()
        run: make check-ci-test-partition

      - name: Verify service architecture and size budgets
        if: always()
        env:
          GOCACHE: ${{ runner.temp }}/static-go-build
        run: make architecture-size-check

      - name: Prune static build cache to this run
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.static-cache.outputs.cache-matched-key == '')
        run: bash scripts/prune-go-build-cache.sh "$RUNNER_TEMP/static-go-build"

      - name: Save static build cache
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.static-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/static-go-build
          key: ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # golangci-lint lanes. Every lane enforces the hard limits in .golangci.yml
  # (which also loads the opt-in live/e2e/e2e_internal/stress/
  # sessioncapacityramp test tags). The linux lane adds the new-code pass and
  # the wireinject pass; the cross lane lints GOOS=windows and GOOS=darwin
  # with cgo disabled (darwin also with the nomicrophone tag), and the darwin
  # cgo lane lints cgo-constrained packages natively on macOS. With a warm
  # build cache each lane's lint step takes seconds and job setup dominates,
  # so the Linux modules share one lane and both cross targets share another.
  # See docs/architecture/lint-policy.md.
  static-lint:
    name: CI (static lint ${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            cache: linux
            runner: ubuntu-latest
            fetch-depth: 0
            command: make lint
          - lane: cross
            cache: cross
            runner: ubuntu-latest
            fetch-depth: 1
            command: make lint-cross
          # cgo-constrained darwin files (CoreAudio capture, display
          # permission) need the macOS SDK.
          - lane: darwin cgo
            cache: darwin-cgo
            runner: macos-14
            fetch-depth: 1
            command: make lint-darwin-cgo
    env:
      STATIC_CACHE_KEY: static-lint-${{ matrix.cache }}-go1.26.7-golangci-lint-v2.9.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum
            go-audio/go.sum
            go-device-gateway/go.sum
            go-agent-runtime/go.sum
            tools/architecturegate/go.sum
            tests/embedding/go.sum

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Restore lint build and analysis caches
        id: static-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/static-go-build
            ${{ runner.temp }}/static-golangci-lint
          key: ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Run golangci-lint
        env:
          GOCACHE: ${{ runner.temp }}/static-go-build
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/static-golangci-lint
        run: ${{ matrix.command }}

      - name: Prune lint build cache to this run
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.static-cache.outputs.cache-matched-key == '')
        run: bash scripts/prune-go-build-cache.sh "$RUNNER_TEMP/static-go-build"

      - name: Save lint build and analysis caches
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.static-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/static-go-build
            ${{ runner.temp }}/static-golangci-lint
          key: ${{ env.STATIC_CACHE_KEY }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Preserve the required "CI (static)" check name while aggregating the
  # parallel static shards. `always()` reports a failed shard as a failed
  # check rather than leaving it skipped.
  static:
    name: CI (static)
    needs:
      - static-gates
      - static-lint
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify static shards completed
        env:
          GATES_RESULT: ${{ needs.static-gates.result }}
          LINT_RESULT: ${{ needs.static-lint.result }}
        run: |
          test "$GATES_RESULT" = success
          test "$LINT_RESULT" = success

  # Fast unit-level checks and the agent-cli link gate. No analyzer binaries
  # needed. Library packages are not compiled here: the coverage libraries
  # shard compiles every one of them.
  unit:
    name: CI (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: unit

      - name: Run repository helper module tests
        if: always()
        run: make test-tools

      - name: Run factory script tests
        if: always()
        run: make test-factory-scripts

      - name: Build agent-cli binaries
        if: always()
        run: make build BUILD_LIBRARY_PACKAGES=0

      - name: Verify standalone checkout dependency graph
        if: always()
        run: scripts/verify-standalone-checkout.sh

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The Linux package corpus has one owner: coverage. agent-cli is isolated
  # because its deterministic integration and replay tests are the long pole;
  # the other modules and embedding consumer run concurrently on one runner.
  # The agent-cli corpus is further split into two disjoint matrix jobs: every
  # package except test/integration, and test/integration. The integration
  # job compiles its coverage-instrumented test binary and helper binaries
  # once and runs AGENT_CLI_INTEGRATION_SHARDS duration-balanced shards of its
  # top-level tests concurrently: the shards mostly wait on paced audio, so
  # one runner overlaps them instead of paying setup and a compile per shard.
  # The coverage gate unions all profiles.
  coverage-agent-cli:
    name: CI (coverage agent-cli ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, integration]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum
            go-audio/go.sum
            go-device-gateway/go.sum
            go-agent-runtime/go.sum
            tools/architecturegate/go.sum
            tests/embedding/go.sum

      - name: Run hermetic agent-cli tests with coverage
        run: make coverage-ci-agent-cli AGENT_CLI_COVERAGE_SHARD=${{ matrix.shard }}

      - name: Upload agent-cli coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-cli-${{ matrix.shard }}
          path: coverage/agent-cli*.out
          if-no-files-found: error
          retention-days: 1

  # The unit, coverage libraries, coverage, race and OS jobs skip docs/temp
  # (about 90% of the checkout's bytes; no Go package, helper-module or
  # factory-script test reads it): a blobless clone fetches only the sparse
  # tree's blobs.
  coverage-libraries:
    name: CI (coverage libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-libraries

      - name: Run hermetic library and embedding tests with coverage
        run: make coverage-ci-libraries

      - name: Upload library coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-libraries
          path: coverage/*.out
          if-no-files-found: error
          retention-days: 1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Preserve the existing required-check name while aggregating the two
  # disjoint profile shards. `always()` ensures a failed shard reports this
  # check as failed rather than leaving it skipped.
  coverage:
    name: CI (coverage)
    needs:
      - coverage-agent-cli
      - coverage-libraries
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Verify coverage shards completed
        env:
          AGENT_CLI_RESULT: ${{ needs.coverage-agent-cli.result }}
          LIBRARIES_RESULT: ${{ needs.coverage-libraries.result }}
        run: |
          test "$AGENT_CLI_RESULT" = success
          test "$LIBRARIES_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-gate

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Run coverage gate
        run: make coverage-gate

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Focused race-detector acceptance tests. Kept together on one runner
  # (rather than split further) to avoid adding more concurrent
  # load-sensitive test processes across additional runners.
  race:
    name: CI (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: race

      - name: Run focused RTC race acceptance
        if: always()
        run: make test-rtc-race

      - name: Run audio stability race corpus
        if: always()
        run: make test-audio-stability-race

      - name: Run concurrent session capacity race acceptance
        if: always()
        run: make test-sessions-race

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # One macOS runner owns every macOS check: the arm64 agent build is shared
  # by the release inspection and the WebMCP proof, and the runner is set up
  # once. `webmcp-chrome` below keeps the required "CI (WebMCP Chrome)" check
  # name and reports the WebMCP step's own outcome.
  macos-audio-release:
    name: CI (macOS audio release)
    runs-on: macos-14
    timeout-minutes: 25
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write
    outputs:
      webmcp: ${{ steps.webmcp.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: macos

      - name: Run package-adjacent macOS audio units
        run: go test ./go-audio/... ./go-device-gateway/... -count=1

      - name: Compile functional physical-device suite
        run: go test ./agent-cli/test/functional -count=1

      - name: Cross-build and inspect native EAC release artifacts
        run: |
          # The two architectures share no build outputs; build them concurrently.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS='-arch arm64' CGO_LDFLAGS='-arch arm64' go build -o "$RUNNER_TEMP/agent-darwin-arm64" ./agent-cli/cmd/agent &
          arm64_build=$!
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS='-arch x86_64' CGO_LDFLAGS='-arch x86_64' go build -o "$RUNNER_TEMP/agent-darwin-amd64" ./agent-cli/cmd/agent &
          amd64_build=$!
          wait "$arm64_build"
          wait "$amd64_build"
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-arm64" darwin_arm64
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-amd64" darwin_amd64

      # `go run goreleaser@version` recompiled GoReleaser on every run
      # (100-130s); cache the pinned binary instead.
      - name: Cache pinned GoReleaser binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/goreleaser
          key: goreleaser-v2.17.0-go1.26.7-${{ runner.os }}-${{ runner.arch }}

      - name: Validate GoReleaser configuration
        run: |
          goreleaser_dir="$HOME/.cache/go-agent-harness/goreleaser"
          if [ ! -x "$goreleaser_dir/goreleaser" ]; then
            GOBIN="$goreleaser_dir" go install github.com/goreleaser/goreleaser/v2@v2.17.0
          fi
          "$goreleaser_dir/goreleaser" check --config .goreleaser.yaml

      # The locked WebMCP Chrome artifact is mac-arm64. Runs even when an
      # audio step failed so its required check always has a real outcome.
      - name: Run production-binary cross-process cancellation acceptance
        id: webmcp
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        working-directory: agent-cli
        env:
          WEBMCP_CLI_CHROME_INTEGRATION: "1"
        run: go test ./internal/webmcp/chrome -run '^TestWebMCPDirectCLIWithPinnedChromeCrossProcessCancel$' -count=1 -v

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Keep this behavioral check required alongside hermetic coverage so skipped
  # opt-in coverage cannot make a pull request appear complete. It runs on the
  # macOS audio release runner and reports that step's outcome here.
  webmcp-chrome:
    name: CI (WebMCP Chrome)
    needs: macos-audio-release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify WebMCP Chrome acceptance passed
        env:
          WEBMCP_RESULT: ${{ needs.macos-audio-release.outputs.webmcp }}
        run: test "$WEBMCP_RESULT" = success

  windows-audio-portable:
    name: CI (Windows audio portable)
    runs-on: windows-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: windows

      - name: Run Windows audio queue regressions
        run: go test ./go-audio/... ./go-device-gateway/... -run 'TestWindowsPortablePlaybackBurstPreservesFIFO|TestVirtualPlaybackCapacityAdversarial' -count=1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
