name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Fast static checks: no build artifacts, no test binaries. This is the
  # only job that needs the pinned golangci-lint/staticcheck binaries, so it
  # is the only job that installs them. Each check step below runs with
  # `if: always()` so a gofmt failure does not hide a lint or staticcheck
  # failure that would otherwise run later in the same job — every static
  # result is visible in one run instead of stopping at the first failure.
  static:
    name: CI (static)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Install staticcheck
        env:
          STATICCHECK_VERSION: 2026.1
        run: bash scripts/install-ci-analyzer.sh staticcheck

      - name: Run gofmt check
        if: always()
        run: make fmt

      - name: Run go vet
        if: always()
        run: make vet

      - name: Run golangci-lint
        if: always()
        run: make lint

      - name: Run staticcheck
        if: always()
        run: make staticcheck

  # Fast unit-level checks and the compile gate. No analyzer binaries needed.
  unit:
    name: CI (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run repository helper module tests
        if: always()
        run: make test-tools

      - name: Run factory script tests
        if: always()
        run: make test-factory-scripts

      - name: Build agent-cli binary and library packages
        if: always()
        run: make build

      - name: Verify standalone agent-cli dependency pins
        if: always()
        working-directory: agent-cli
        env:
          GOWORK: "off"
        run: |
          test "$(go list -m -f '{{.Version}}' github.com/portpowered/go-agent-harness/go-agent-loop)" = "v0.0.3"
          test "$(go list -m -f '{{.Version}}' github.com/portpowered/go-agent-harness/go-llm-gateway)" = "v0.0.5-0.20260904005433-1a695c9c6934"
          go build -o "$RUNNER_TEMP/yui-standalone" ./cmd/yui

  # The long pole: deterministic integration tests plus committed
  # replay/fixture regression tests. Kept as its own job (not split further)
  # so both suites stay on one runner together rather than adding more
  # concurrent load-sensitive test processes across additional runners.
  integration:
    name: CI (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run deterministic integration tests
        if: always()
        run: make test-integration

      - name: Run production-binary audio-device replay integration
        if: always()
        run: make test-audio-device-server-integration

      - name: Run committed replay and fixture regression tests
        if: always()
        run: make test-regressions

  # Per-module coverage profiles plus the coverage gate. No analyzer
  # binaries needed.
  coverage:
    name: CI (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run coverage profiles and coverage gate
        run: make coverage

  # Focused race-detector acceptance tests. Kept together on one runner
  # (rather than split further) to avoid adding more concurrent
  # load-sensitive test processes across additional runners.
  race:
    name: CI (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run focused RTC race acceptance
        if: always()
        run: make test-rtc-race

      - name: Run audio stability race corpus
        if: always()
        run: make test-audio-stability-race

      - name: Run concurrent session capacity race acceptance
        if: always()
        run: make test-sessions-race

  hermetic:
    name: CI (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run hermetic test pipeline
        run: make test-hermetic

  webmcp-chrome:
    name: CI (WebMCP Chrome)
    # The locked WebMCP Chrome artifact is mac-arm64. Keep this behavioral
    # check required alongside the hermetic jobs so skipped opt-in coverage
    # cannot make a pull request appear complete.
    runs-on: macos-14
    timeout-minutes: 20
    env:
      WEBMCP_CLI_CHROME_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run production-binary cross-process cancellation acceptance
        working-directory: agent-cli
        run: go test ./internal/webmcp/chrome -run '^TestWebMCPDirectCLIWithPinnedChromeCrossProcessCancel$' -count=1 -v

  macos-audio-release:
    name: CI (macOS audio release)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run package-adjacent macOS audio units
        run: go test ./agent-cli/internal/audio -count=1

      - name: Compile functional physical-device suite
        run: go test ./agent-cli/test/functional -count=1

      - name: Cross-build and inspect native EAC release artifacts
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS='-arch arm64' CGO_LDFLAGS='-arch arm64' go build -o "$RUNNER_TEMP/agent-darwin-arm64" ./agent-cli/cmd/agent
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS='-arch x86_64' CGO_LDFLAGS='-arch x86_64' go build -o "$RUNNER_TEMP/agent-darwin-amd64" ./agent-cli/cmd/agent
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-arm64" darwin_arm64
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-amd64" darwin_amd64

      - name: Validate GoReleaser configuration
        run: go run github.com/goreleaser/goreleaser/v2@v2.17.0 check --config .goreleaser.yaml

  windows-audio-portable:
    name: CI (Windows audio portable)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run Windows audio queue regressions
        run: go test ./agent-cli/internal/audio -run 'TestWindowsPortablePlaybackBurstPreservesFIFO|TestVirtualPlaybackCapacityAdversarial' -count=1
