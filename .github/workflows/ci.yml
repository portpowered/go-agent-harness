name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Install staticcheck
        env:
          STATICCHECK_VERSION: 2026.1
        run: bash scripts/install-ci-analyzer.sh staticcheck

      - name: Run focused RTC race acceptance
        run: make test-rtc-race

      - name: Run concurrent session capacity race acceptance
        run: make test-sessions-race

      - name: Run root CI pipeline
        run: make ci

  hermetic:
    name: CI (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: |
            go.work.sum
            agent-cli/go.sum
            go-agent-loop/go.sum
            go-llm-gateway/go.sum

      - name: Run hermetic test pipeline
        run: make test-hermetic
