name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The nightly run re-executes every test (GO_TEST_COUNT=1) on main, so a
  # result the test cache replayed on pull requests is re-proven daily.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: Re-run every test instead of reusing Go's cached test results.
        type: boolean
        default: true

permissions:
  contents: read

# Test runs reuse Go's test result cache (restored with each job's build
# cache): a package whose test binary, flags, and the environment variables
# and in-module files its tests read are unchanged since a cached run replays
# that result, coverage profile included, instead of re-running. That is not
# a skip: any change to those inputs re-runs the package. Tests whose real
# inputs Go cannot see always run with -count=1 (the packages listed in
# scripts/go-test-fresh-packages.txt, the tool modules that read the
# workspace, and the race, device, Chrome and integration runs). The
# scheduled run and a manual dispatch set GO_TEST_COUNT=1, which re-runs
# every test (and does not save caches: see go-cache-save).
env:
  GO_TEST_COUNT: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fresh)) && '1' || '' }}

jobs:
  # Every job starts at once (no `needs:`), and each must finish within three
  # minutes even with a cold build cache (the first main run after a
  # toolchain or cache-key change, or an evicted cache): that, not the warm
  # time, bounds how far jobs can be merged. A job that must report after
  # its siblings (CI (static), CI (coverage)) waits for them at its end with
  # scripts/ci-await-jobs.sh instead of adding a relay job behind them.
  #
  # Every job restores its own Go build and module caches through
  # .github/actions/go-cache and skips docs/temp (about 90% of the
  # checkout's bytes; no check reads it): a blobless clone fetches only the
  # sparse tree's blobs.

  # The required "CI (static)" check: gofmt, the CI test partition and the
  # architecture and size gate (which needs full history for its baseline
  # merge-base check), then every lint lane. (make wire-check runs in CI
  # (unit), which has cold-budget room for it.)
  # Each check step runs with `if: always()` so an early failure does not
  # hide later results.
  #
  # go vet and standalone staticcheck do not run here: golangci-lint's
  # standard linters (govet with the go vet analyzer set, staticcheck with
  # every SA/S/ST/QF check staticcheck enables by default, and unused)
  # enforce them on every lint lane. See docs/architecture/lint-policy.md.
  static:
    name: CI (static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches (and
    # lets ci-await-jobs read the lint lanes).
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: static

      - name: Run gofmt check
        if: always()
        run: make fmt

      - name: Verify CI test partition
        if: always()
        run: make check-ci-test-partition

      - name: Verify service architecture and size budgets
        if: always()
        run: make architecture-size-check

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

      # Every lane is an ubuntu runner, so the wait never sits behind the
      # macOS runner queue. --min-matches is the lane count below: a lane
      # dropped from the matrix by mistake fails the wait.
      - name: Wait for the lint lanes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-await-jobs.sh --min-matches 9 "CI (static lint *"

  # golangci-lint lanes. CI (static) waits for every job whose name starts
  # with "CI (static lint ", so lanes are merged or split here, plus the
  # lane count in its --min-matches: change a lane's LINT_SHARD (agent-cli,
  # runtime, support, libraries, all) or LINT_CROSS_GOOS (e.g. "windows
  # darwin") once the merged lane fits the cold budget. golangci-lint loads
  # dependencies from compiled export data, so a cold lane spends most of
  # its time compiling, and a lane's cold time is roughly the sum of its
  # modules' compile and analysis CPU on the 4-vCPU runner, and varies by
  # up to ~35% between runs. Every merge measured cold (empty Go build,
  # module and golangci-lint caches) went over or too close to the budget:
  # windows or darwin libraries 142-179s and 127-177s (#601: one run in an
  # isolated experiment, one in the full workflow), linux libraries 196s,
  # linux agent-cli+support 174s, windows+darwin agent-cli 173s, runtime
  # 192s, support 191s, one lane per OS 213-243s, and CI (static)'s checks
  # plus any linux lane 163-170s (runs 36210316761, 36210652899,
  # 36211278527, 36211944579). The single lanes took 66-148s cold there.
  #
  # Every lane enforces the hard limits in .golangci.yml (which also loads the
  # opt-in live/e2e/e2e_internal/stress/sessioncapacityramp test tags). The
  # linux lanes add the new-code pass and the wireinject pass; the windows
  # and darwin lanes lint with cgo disabled (darwin also with the
  # nomicrophone tag). The cgo-constrained darwin packages are linted
  # natively in CI (WebMCP Chrome), which already runs on macOS. See
  # docs/architecture/lint-policy.md.
  static-lint:
    name: CI (static lint ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux agent-cli
            cache: static-lint-linux-agent-cli
            fetch-depth: 0
            command: make lint LINT_SHARD=agent-cli
          - lane: linux runtime
            cache: static-lint-linux-runtime
            fetch-depth: 0
            command: make lint LINT_SHARD=runtime
          - lane: linux support
            cache: static-lint-linux-support
            fetch-depth: 0
            command: make lint LINT_SHARD=support
          - lane: windows agent-cli
            cache: static-lint-windows-agent-cli
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=agent-cli
          - lane: windows runtime
            cache: static-lint-windows-runtime
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=runtime
          - lane: windows support
            cache: static-lint-windows-support
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=windows LINT_SHARD=support
          - lane: darwin agent-cli
            cache: static-lint-darwin-agent-cli
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=agent-cli
          - lane: darwin runtime
            cache: static-lint-darwin-runtime
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=runtime
          - lane: darwin support
            cache: static-lint-darwin-support
            fetch-depth: 1
            command: make lint-cross LINT_CROSS_GOOS=darwin LINT_SHARD=support

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: ${{ matrix.cache }}
          extra-paths: ${{ runner.temp }}/golangci-lint

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Run golangci-lint
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: ${{ matrix.command }}

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
          extra-paths: ${{ runner.temp }}/golangci-lint

  # Fast unit-level checks, the agent-cli link gate and the generated Wire
  # composition check. No analyzer binaries needed. Library packages are not
  # compiled here: the coverage libraries job compiles every one of them.
  unit:
    name: CI (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: unit

      - name: Run repository helper module tests
        if: always()
        run: make test-tools

      - name: Run factory script tests
        if: always()
        run: make test-factory-scripts

      - name: Build agent-cli binaries
        if: always()
        run: make build BUILD_LIBRARY_PACKAGES=0

      - name: Verify standalone checkout dependency graph
        if: always()
        run: scripts/verify-standalone-checkout.sh

      # wire-check runs here rather than in CI (static): together with the
      # architecture gate it took CI (static) to ~170s with a cold cache.
      - name: Verify generated service composition
        if: always()
        run: make wire-check

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The Linux package corpus has one owner: coverage, as two disjoint jobs
  # that run concurrently. agent-cli (CI (coverage)) runs test/integration
  # and then its unit packages on one runner, so the unit tests reuse the
  # integration build's coverage-instrumented compiles; the other modules and
  # the embedding consumer share another runner (coverage libraries). All
  # three in one job took 194-251s cold (experiment run 36195053824),
  # over the three-minute budget.
  #
  # The integration step compiles its coverage-instrumented test binary once
  # (building the helper binaries alongside) and runs
  # AGENT_CLI_INTEGRATION_SHARDS duration-balanced shards of its top-level
  # tests concurrently: the shards mostly wait on paced audio, so one runner
  # overlaps them instead of paying setup and a compile per shard.
  coverage-libraries:
    name: CI (coverage libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-libraries

      - name: Run hermetic library and embedding tests with coverage
        run: make coverage-ci-libraries

      - name: Upload library coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-libraries
          path: coverage/*.out
          if-no-files-found: error
          retention-days: 1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The required "CI (coverage)" check: the agent-cli integration shards and
  # unit packages, then the coverage gate over every profile once
  # coverage libraries has succeeded. The gate does not run if the agent-cli
  # tests fail.
  coverage:
    name: CI (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write lets go-cache-save delete superseded main caches (and
    # lets ci-await-jobs read coverage libraries).
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: coverage-agent-cli
          # This job's cache was named after its integration tests alone.
          fallback-cache-names: coverage-agent-cli-integration

      # The integration shards run first, on a fresh runner as they did in
      # a job of their own (they are timing-bound); the unit packages then
      # reuse the integration build's coverage-instrumented compiles. The
      # unit step runs even when an integration test fails, so that failure
      # does not hide the unit results (the job still fails).
      - name: Run hermetic agent-cli integration tests with coverage
        run: make coverage-ci-agent-cli AGENT_CLI_COVERAGE_SHARD=integration

      - name: Run hermetic agent-cli unit tests with coverage
        if: ${{ !cancelled() }}
        run: make coverage-ci-agent-cli AGENT_CLI_COVERAGE_SHARD=unit

      - name: Wait for coverage libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-await-jobs.sh "CI (coverage libraries)"

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Run coverage gate
        run: make coverage-gate

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Focused race-detector acceptance tests. Kept together on one runner
  # (rather than split further) to avoid adding more concurrent
  # load-sensitive test processes across additional runners. Each target
  # race-compiles only the packages it runs tests from, and the Makefile sets
  # GORACE=atexit_sleep_ms=0 so no race test binary idles 1s at exit. The
  # Linux device step is also the only job that builds the native (cgo,
  # malgo) Linux device backend and its tests.
  race:
    name: CI (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: race

      - name: Run focused RTC race acceptance
        if: always()
        run: make test-rtc-race

      - name: Run audio stability race corpus
        if: always()
        run: make test-audio-stability-race

      - name: Run concurrent session capacity race acceptance
        if: always()
        run: make test-sessions-race

      - name: Run agent loop session, engine and participant race corpus
        if: always()
        run: make test-loop-race

      - name: Run native Linux device backend race tests
        if: always()
        run: make test-linux-devices-race

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The macOS audio units, the darwin cross-build release inspection and
  # the GoReleaser check. The WebMCP Chrome proof runs on its own macOS
  # runner below: in one job it ran after the cross-build and put the job
  # over three minutes with a cold cache, and the two share no build outputs
  # (the cross-build sets CGO_CFLAGS per architecture, so its cgo packages
  # never match the native build the WebMCP test links).
  macos-audio-release:
    name: CI (macOS audio release)
    runs-on: macos-14
    timeout-minutes: 25
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: macos

      - name: Run package-adjacent macOS audio units
        run: go test ./go-audio/... ./go-device-gateway/... -count=1

      - name: Compile functional physical-device suite
        run: go test ./agent-cli/test/functional -count=1

      - name: Cross-build and inspect native EAC release artifacts
        run: |
          # The two architectures share no build outputs; build them concurrently.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS='-arch arm64' CGO_LDFLAGS='-arch arm64' go build -o "$RUNNER_TEMP/agent-darwin-arm64" ./agent-cli/cmd/agent &
          arm64_build=$!
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS='-arch x86_64' CGO_LDFLAGS='-arch x86_64' go build -o "$RUNNER_TEMP/agent-darwin-amd64" ./agent-cli/cmd/agent &
          amd64_build=$!
          wait "$arm64_build"
          wait "$amd64_build"
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-arm64" darwin_arm64
          ./scripts/verify-darwin-eac-artifact.sh "$RUNNER_TEMP/agent-darwin-amd64" darwin_amd64

      # `go run goreleaser@version` recompiled GoReleaser on every run
      # (100-130s); cache the pinned binary instead.
      - name: Cache pinned GoReleaser binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/goreleaser
          key: goreleaser-v2.17.0-go1.26.7-${{ runner.os }}-${{ runner.arch }}

      - name: Validate GoReleaser configuration
        run: |
          goreleaser_dir="$HOME/.cache/go-agent-harness/goreleaser"
          if [ ! -x "$goreleaser_dir/goreleaser" ]; then
            GOBIN="$goreleaser_dir" go install github.com/goreleaser/goreleaser/v2@v2.17.0
          fi
          "$goreleaser_dir/goreleaser" check --config .goreleaser.yaml

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # Keep this behavioral check required alongside hermetic coverage so skipped
  # opt-in coverage cannot make a pull request appear complete. The locked
  # WebMCP Chrome artifact is mac-arm64. The test runs in the default build
  # (no build tag), which is where it and every helper it uses live.
  #
  # The job also lints the cgo-constrained darwin packages (CoreAudio
  # capture, display permission), which need the macOS SDK: on its own macOS
  # runner that lane was mostly setup, and CI (static) had to wait for it
  # behind the macOS runner queue. Together they took 124-141s cold in real
  # CI runs (91-113s in an isolated experiment). Adding the golangci-lint
  # cache to extra-paths changed this job's cache version, so the first run
  # after that change restored nothing and ran cold.
  webmcp-chrome:
    name: CI (WebMCP Chrome)
    runs-on: macos-14
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: macos-webmcp
          extra-paths: ${{ runner.temp }}/golangci-lint

      - name: Cache pinned analyzer binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/go-agent-harness/ci-analyzers
          key: ci-analyzers-${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.9.0-staticcheck-2026.1

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: bash scripts/install-ci-analyzer.sh golangci-lint

      - name: Run production-binary cross-process cancellation acceptance
        working-directory: agent-cli
        env:
          WEBMCP_CLI_CHROME_INTEGRATION: "1"
        run: go test ./internal/webmcp/chrome -run '^TestWebMCPDirectCLIWithPinnedChromeCrossProcessCancel$' -count=1 -v

      - name: Lint cgo-constrained darwin packages
        if: always()
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: make lint-darwin-cgo

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}
          extra-paths: ${{ runner.temp }}/golangci-lint

  # The Windows device backend (every TestWindows*/TestWASAPI* test in
  # device_windows_test.go; the WASAPI endpoint tests skip without an audio
  # endpoint), the portable capacity regression and the codec coverage the
  # Windows cases rely on. Only the two packages that hold them are compiled.
  windows-audio-portable:
    name: CI (Windows audio portable)
    runs-on: windows-latest
    timeout-minutes: 15
    # actions: write lets go-cache-save delete superseded main caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: windows

      - name: Run Windows audio queue regressions
        run: go test ./go-audio/pkg/codec ./go-device-gateway/pkg/devices -run '^(TestWindowsPortablePlaybackBurstPreservesFIFO.*|TestWASAPI.*|TestVirtualPlaybackCapacityAdversarial|TestPacketEnergyC42Coverage)$' -count=1

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

  # The scheduled run re-executes every test (GO_TEST_COUNT=1). Its failure
  # opens (or comments on) an issue, so a regression the test cache replayed
  # past on pull requests is never left unnoticed. Skipped on every other
  # event.
  nightly-report:
    name: Report nightly fresh-test failure
    if: failure() && github.event_name == 'schedule'
    needs: [static, static-lint, unit, coverage-libraries, coverage, race, macos-audio-release, webmcp-chrome, windows-audio-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly fresh CI run failed
        run: |
          body="The nightly CI run (every test re-executed, GO_TEST_COUNT=1) failed on ${GITHUB_SHA::9}: ${RUN_URL}"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body

          A test that passes from Go's test cache on pull requests may fail when re-run: reproduce with \`make coverage GO_TEST_COUNT=1\` (or dispatch CI with fresh). Close this issue once the nightly run passes again."
          fi
