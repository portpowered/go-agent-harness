name: Nightly audio stress

# Stress trials that hunt rare races rather than prove behavior. They used to
# run on every pull request inside the agent-cli integration coverage job
# (YUI_AUDIO_STRESS=1: 40 fresh agent/device process pairs, ~140 CPU-s on a
# 4-vCPU runner already running the timing-bound integration shards). They
# run here once a day against main instead, and on demand. The same gate
# holds the fresh-process tool-continuation matrix, whose device-cadence
# deliveries drain in real time (all but test45/captured_cadence, which stays
# in the pull-request corpus; pull requests also run every topology and
# delivery in-process on a virtual clock), so it runs here too. Locally:
# `make test-audio-stress AUDIO_STRESS_COUNT=N`.
#
# A scheduled failure opens (or comments on) a "Nightly audio stress failed"
# issue, so a regression is noticed without anyone watching the Actions tab.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of the 20-trial Test45/Test46 stress pair and the device-cadence tool continuations.
        required: false
        default: "4"
  # Exercise the workflow itself when it changes.
  pull_request:
    paths:
      - .github/workflows/nightly-audio-stress.yml

permissions:
  contents: read

# One group per trigger: a manual dispatch or a pull request never cancels an
# in-progress scheduled run. Only a newer push to the same pull request
# cancels its older run.
concurrency:
  group: nightly-audio-stress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audio-stress:
    name: Nightly audio stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write lets go-cache-save delete superseded main caches;
    # issues: write lets a scheduled failure open or update its issue.
    permissions:
      contents: read
      actions: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/temp/

      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          cache-name: nightly-audio-stress

      - name: Run high-rate tool-audio stress trials
        env:
          AUDIO_STRESS_COUNT: ${{ github.event.inputs.count || '4' }}
        run: |
          case "$AUDIO_STRESS_COUNT" in
            '' | *[!0-9]* | 0*) echo "::error::count must be a positive integer, got '$AUDIO_STRESS_COUNT'"; exit 2 ;;
          esac
          make test-audio-stress AUDIO_STRESS_COUNT="$AUDIO_STRESS_COUNT"

      - name: Save Go cache
        if: always()
        uses: ./.github/actions/go-cache-save
        with:
          primary-key: ${{ steps.go.outputs.primary-key }}
          matched-key: ${{ steps.go.outputs.matched-key }}
          gocache: ${{ steps.go.outputs.gocache }}
          gomodcache: ${{ steps.go.outputs.gomodcache }}

      - name: Report failure in an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly audio stress failed
        run: |
          body="The ${GITHUB_EVENT_NAME} run of the Nightly audio stress workflow failed on ${GITHUB_SHA::9}: ${RUN_URL}"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body

          Reproduce locally with \`make test-audio-stress AUDIO_STRESS_COUNT=4\`. Close this issue once the stress trials pass again."
          fi
