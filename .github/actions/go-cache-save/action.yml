name: Save the per-job Go cache
description: >-
  Prune the Go build cache to the entries this job used and save it under the
  key go-cache resolved. Pushes to main save every commit so pull requests
  restore a recent main cache; pull requests only save when they found no
  cache at all, so they neither upload on every push nor evict main's caches.
  A job that restored its own cache and added no cache file (every package,
  test result and module was reused) skips the upload: it would save the
  entries it restored. A fresh-test run (GO_TEST_COUNT set) never saves: it
  reads no test results, so its prune would drop main's cached ones.

inputs:
  primary-key:
    description: go-cache primary-key output.
    required: true
  matched-key:
    description: go-cache matched-key output.
    required: true
  gocache:
    description: go-cache gocache output.
    required: true
  gomodcache:
    description: go-cache gomodcache output.
    required: true
  extra-paths:
    description: The extra-paths value passed to go-cache, if any.
    required: false
    default: ""
  token:
    description: >-
      Token with actions: write, used on main to delete this job's superseded
      caches after a save.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check for new cache entries
      id: check
      if: inputs.matched-key != inputs.primary-key && (github.ref == 'refs/heads/main' || inputs.matched-key == '') && env.GO_TEST_COUNT == ''
      shell: bash
      env:
        PRIMARY: ${{ inputs.primary-key }}
        MATCHED: ${{ inputs.matched-key }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        # go-<job>-<os>-<arch>-go<version>-: a restored key of another job
        # (a fallback-cache-names hit) is always saved under this job's name.
        own="${PRIMARY%-*}"
        own="${own%-*}-"
        case "$MATCHED" in
          "$own"*) ;;
          *) echo "save=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        "$python" "$GITHUB_ACTION_PATH/../go-cache/gocache_working_set.py" changed "$RUNNER_TEMP/go-cache-files.txt" \
          "${{ inputs.gocache }}" "${{ inputs.gomodcache }}/cache/download" >>"$GITHUB_OUTPUT"

    - name: Prune Go build cache to this job's working set
      if: steps.check.outputs.save == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        "$python" "$GITHUB_ACTION_PATH/../go-cache/gocache_working_set.py" prune "${{ inputs.gocache }}"

    - name: Save Go build and module caches
      if: steps.check.outputs.save == 'true'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ inputs.gocache }}
          ${{ inputs.gomodcache }}
          ${{ inputs.extra-paths }}
        key: ${{ inputs.primary-key }}

    # Keep one main cache per job: restores fall back to the newest entry, so
    # older entries only consume the repository's 10 GB quota.
    - name: Delete superseded main Go caches
      if: github.ref == 'refs/heads/main' && steps.check.outputs.save == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/delete_superseded_caches.sh" "${{ inputs.primary-key }}" || true
