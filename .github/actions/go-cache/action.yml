name: Set up Go with a per-job build cache
description: >-
  Install the pinned Go toolchain and restore this job's own Go build and
  module caches. setup-go's built-in cache is one entry per go.sum hash shared
  by every job: it is written once by whichever job finishes first and never
  refreshed, so its build cache goes stale and rarely holds what a given job
  compiles. This cache is keyed per job and per commit, falls back to the
  job's newest cache, and is saved by go-cache-save as the job's exact working
  set.

inputs:
  cache-name:
    description: Stable per-job cache name, e.g. coverage-libraries.
    required: true
  extra-paths:
    description: >-
      Newline-separated extra directories cached with the Go caches, e.g. a
      golangci-lint analysis cache. Pass the same value to go-cache-save.
    required: false
    default: ""
  fallback-cache-names:
    description: >-
      Newline-separated cache names of other jobs whose newest cache to
      restore when this job has none yet (a new or renamed job, e.g. one that
      merges those jobs), tried in order after this job's own keys. The
      restored build cache is a superset or near-superset of what the job
      compiles, so only a toolchain bump leaves it truly cold; the next save
      prunes it to this job's working set under its own name. A fallback
      only hits a cache saved with the same paths: actions/cache versions
      every entry by its path list, so the fallback job must have cached
      exactly this job's paths, including the same extra-paths (a lint
      lane's cache never restores into a job without its golangci-lint
      directory, or the other way around).
    required: false
    default: ""

outputs:
  primary-key:
    description: Cache key for this commit.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  matched-key:
    description: Key that was restored, empty when nothing matched.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  gocache:
    description: GOCACHE directory.
    value: ${{ steps.paths.outputs.gocache }}
  gomodcache:
    description: GOMODCACHE directory.
    value: ${{ steps.paths.outputs.gomodcache }}

runs:
  using: composite
  steps:
    # Go's test result cache keys the files a test reads on their size and
    # mtime, and actions/checkout stamps every file with the current time, so
    # without this no test that reads a file (testdata, fixtures) is ever
    # reused. Run after actions/checkout and before anything writes to the
    # tree; CI checkouts are clean, so each file's content is its blob's.
    - name: Set content-derived source mtimes
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        "$python" "$GITHUB_ACTION_PATH/source_mtimes.py" "$GITHUB_WORKSPACE"

    # Linux images do not ship this Go release, and setup-go's download plus
    # extraction took ~11s per job. macOS images ship it. Windows is left to
    # setup-go: its tool cache entry is a symlink that a restored copy breaks.
    - name: Cache Go toolchain
      if: runner.os == 'Linux'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ runner.tool_cache }}/go/1.26.7
        key: go-toolchain-1.26.7-${{ runner.os }}-${{ runner.arch }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.7"
        cache: false

    - name: Resolve Go cache directories
      id: paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Resolve cache keys
      id: keys
      shell: bash
      env:
        SUMS: ${{ hashFiles('go.work.sum', '*/go.sum', 'tests/embedding/go.sum', 'tools/*/go.sum') }}
        NAME: ${{ inputs.cache-name }}
        FALLBACKS: ${{ inputs.fallback-cache-names }}
      run: |
        platform="$RUNNER_OS-$RUNNER_ARCH-go1.26.7"
        echo "primary=go-$NAME-$platform-$SUMS-$GITHUB_SHA" >>"$GITHUB_OUTPUT"
        {
          echo "restore<<EOF"
          for name in "$NAME" $FALLBACKS; do
            echo "go-$name-$platform-$SUMS-"
            echo "go-$name-$platform-"
          done
          echo "EOF"
        } >>"$GITHUB_OUTPUT"

    - name: Restore Go build and module caches
      id: restore
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          ${{ inputs.extra-paths }}
        key: ${{ steps.keys.outputs.primary }}
        restore-keys: ${{ steps.keys.outputs.restore }}

    - name: Backdate restored build cache entries
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        "$python" "$GITHUB_ACTION_PATH/gocache_working_set.py" age "${{ steps.paths.outputs.gocache }}"

    # go-cache-save compares against this list and skips the upload when the
    # job added no cache file (e.g. every package and test result was reused).
    - name: Record restored cache files
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      env:
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        "$python" "$GITHUB_ACTION_PATH/gocache_working_set.py" snapshot "$RUNNER_TEMP/go-cache-files.txt" \
          "${{ steps.paths.outputs.gocache }}" "${{ steps.paths.outputs.gomodcache }}/cache/download"
