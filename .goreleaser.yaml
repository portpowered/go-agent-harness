version: 2

project_name: go-agent-harness

dist: dist

before:
  hooks:
    - go mod download

builds:
  - id: agent
    main: ./agent-cli/cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: agent
    ids:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: portpowered
    name: go-agent-harness
  name_template: "{{ .ProjectName }} {{ .Tag }}"
