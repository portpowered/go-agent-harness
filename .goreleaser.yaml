version: 2

project_name: go-agent-harness

dist: dist

before:
  hooks:
    - go mod download

builds:
  - id: agent-portable
    main: ./agent-cli/cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  - id: agent-darwin-amd64
    main: ./agent-cli/cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-arch x86_64
      - CGO_LDFLAGS=-arch x86_64
    goos:
      - darwin
    goarch:
      - amd64
    hooks:
      post:
        - cmd: ./scripts/verify-darwin-eac-artifact.sh "{{ .Path }}" "{{ .Target }}"
          output: true
  - id: agent-darwin-arm64
    main: ./agent-cli/cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-arch arm64
      - CGO_LDFLAGS=-arch arm64
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      post:
        - cmd: ./scripts/verify-darwin-eac-artifact.sh "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  - id: agent
    ids:
      - agent-portable
      - agent-darwin-amd64
      - agent-darwin-arm64
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: portpowered
    name: go-agent-harness
  name_template: "{{ .ProjectName }} {{ .Tag }}"
