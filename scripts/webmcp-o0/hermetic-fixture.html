<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebMCP O0 hermetic fixture</title>
</head>
<body>
  <main>
    <h1>WebMCP O0 hermetic fixture</h1>
    <p id="ready">starting</p>
    <p>State: <strong id="state">initial</strong></p>
  </main>
  <script>
    (() => {
      const state = {
        ready: false,
        value: "initial",
        transitions: []
      };
      window.__webmcpO0Hermetic = state;

      const render = () => {
        document.querySelector("#ready").textContent = state.ready ? "ready" : "starting";
        document.querySelector("#state").textContent = state.value;
      };

      state.transition = () => {
        state.value = "transitioned";
        state.transitions.push(state.value);
        render();
        return state.value;
      };
      state.ready = true;
      render();
    })();
  </script>
</body>
</html>
