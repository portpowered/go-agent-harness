version: "2"

# The single, hard lint policy. Every linter below applies to ALL code in
# every LINT_MODULES module (production and tests, every build tag and
# platform lane) and any finding fails `make lint`. There is no new-code-only
# pass, no new-from-rev filter and no baseline. The only exceptions are the
# documented permanent exclusions and the temporary round-3 exclusions at the
# end of this file, which the per-module lint tracks remove.
# See docs/architecture/lint-policy.md.

run:
  # golangci-lint runs once per module directory. Report and match paths
  # relative to the repository root (e.g. agent-cli/internal/...) so that
  # exclusion rules can name a module.
  relative-path-mode: gitroot
  # Tests follow the same policy as production, including the size and
  # complexity limits below (the architecture gate no longer measures size).
  tests: true
  # Opt-in build tags are linted with the same limits as default-tag code.
  # Some e2e and live files share helpers, so the tags load together.
  # wireinject is linted in a separate pass (it swaps out !wireinject files);
  # see `make lint-wireinject`.
  build-tags:
    - live
    - e2e
    - stress

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report every linter on a line (e.g. funlen and gocognit on one function).
  uniq-by-line: false

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Size and complexity.
    - funlen
    - gocyclo
    - gocognit
    - revive
    - nestif
    - dupl
    # Correctness and error flow.
    - nilerr
    - nilnesserr
    - bodyclose
    - durationcheck
    - errorlint
    - contextcheck
    - containedctx
    - noctx
    - fatcontext
    - gocritic
    - gosec
    - makezero
    - reassign
    - asasalint
    - bidichk
    - wastedassign
    - unparam
    - recvcheck
    - errname
    - predeclared
    - iface
    # Policy values and finite state.
    - goconst
    - mnd
    - exhaustive
    # Package state, prohibited effects, suppression hygiene.
    - gochecknoglobals
    - gochecknoinits
    - forbidigo
    - depguard
    - nolintlint
    - godox
    # Modern/std idioms.
    - exptostd
    - canonicalheader
    - usestdlibvars
    - mirror
    - copyloopvar
    - intrange
    - misspell
    - nakedret
    # Tests.
    - testifylint
    - usetesting
    - tparallel
    - thelper

  settings:
    # Size and complexity limits are owned here, for all code, with no baseline
    # (tools/architecturegate checks only service shape and boundaries). Each
    # value is the tightest one every current file passes on every lint lane;
    # lower a value when the code allows it, never raise it (the hard caps are
    # 1000 lines per file and 100 lines per function).
    # See docs/architecture/lint-policy.md#size-and-complexity.
    funlen:
      lines: 100
      statements: 78
      ignore-comments: false
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 5
    dupl:
      threshold: 150
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 978
              skip-comments: false
              skip-blank-lines: false
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Win32 procedure calls always return a non-nil GetLastError value; the
      # primary return value carries success, so callers check that instead.
      exclude-functions:
        - (*syscall.LazyProc).Call
        - (*syscall.Proc).Call
        - syscall.SyscallN
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      check:
        - switch
      # A default branch must not silently hide a newly added enum member.
      default-signifies-exhaustive: false
      package-scope-only: true
    goconst:
      min-len: 4
      min-occurrences: 3
      match-constant: true
      numbers: false
      ignore-calls: true
    mnd:
      checks: [argument, case, condition, operation, return, assign]
      # Language and wire protocol sentinels are intentionally readable as
      # literals. Meaningful policy values still require named constants.
      ignored-numbers: ["0", "1", "2", "10", "100", "255"]
    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks: [ifElseChain, singleCaseSwitch, elseif, captLocal, assignOp, unlambda, commentedOutCode, uncheckedInlineErr, evalOrder]
    gosec:
      includes: [G110, G112, G114, G201, G202, G203, G402, G403, G501, G502, G503, G504, G505, G601]
    iface:
      enable: [identical, unused]
      settings:
        unused:
          # go-agent-runtime/services/<name> are the runtime's public contract
          # packages: they declare the role interfaces that wire packages,
          # agent-cli and external embedders implement and consume, so use
          # inside the declaring package is not expected. Implementation
          # packages (internal/**) stay under the unused check.
          exclude:
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/audioio
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/browserconversation
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/devices
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/providers
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/recording
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/replay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/roomevidence
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/roomreplay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/rooms
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/rtctransport
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/selfplay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/session
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessionduration
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessiontrace
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessionturn
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/tools
    recvcheck:
      # encoding/json and encoding.TextUnmarshaler require pointer-receiver
      # decoders while encoders stay on value receivers (so values marshal);
      # the builtin exclusions already cover the Marshal* half.
      exclusions: ["*.UnmarshalJSON", "*.UnmarshalText"]
    godox:
      keywords: [FIXME, HACK, XXX, BUG, TODO]
    depguard:
      rules:
        deprecated:
          files: ["$all"]
          deny:
            - {pkg: io/ioutil, desc: use io and os}
            - {pkg: "math/rand$", desc: use math/rand/v2}
            - {pkg: github.com/pkg/errors, desc: use errors and fmt.Errorf with %w}
        library-logging:
          files: ["$all", "!$test", "!**/cmd/**", "!**/main.go"]
          deny:
            - {pkg: "log$", desc: inject a logger; library code must not write to the global log}
        # Module dependency direction and contract boundaries. Paths are
        # anchored at the repository root (the directory of this file). A deny
        # entry is an import-path prefix unless it ends in $ (exact match).
        # tools/architecturegate keeps the rules depguard cannot express
        # (service shape, glob import patterns such as **/services/internal/**);
        # see lint-policy.md.
        reusable-modules:
          files:
            - "${config-path}/go-agent-loop/**"
            - "${config-path}/go-audio/**"
            - "${config-path}/go-device-gateway/**"
            - "${config-path}/go-llm-gateway/**"
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-runtime, desc: lower reusable modules must not depend on the extracted runtime}
            - {pkg: github.com/portpowered/go-agent-harness/agent-cli, desc: reusable modules must not import the CLI module}
        runtime-module:
          files: ["${config-path}/go-agent-runtime/**"]
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/agent-cli, desc: reusable modules must not import the CLI module}
        agent-loop:
          files: ["${config-path}/go-agent-loop/**"]
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/go-device-gateway, desc: the execution loop stays independent of device and provider adapters}
            - {pkg: github.com/portpowered/go-agent-harness/go-llm-gateway, desc: the execution loop stays independent of device and provider adapters}
        agent-loop-production:
          files: ["${config-path}/go-agent-loop/**", "!$test"]
          deny:
            - {pkg: "encoding/binary$", desc: the loop exchanges PCM through go-audio/pkg/codec; it never parses audio bytes itself}
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-loop/pkg/platform/clock, desc: the loop takes clocks from go-audio}
        go-audio:
          files: ["${config-path}/go-audio/**"]
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/agent-cli, desc: audio primitives remain independent of orchestration and host adapters}
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-loop, desc: audio primitives remain independent of orchestration and host adapters}
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-runtime, desc: audio primitives remain independent of orchestration and host adapters}
            - {pkg: github.com/portpowered/go-agent-harness/go-device-gateway, desc: audio primitives remain independent of orchestration and host adapters}
            - {pkg: github.com/portpowered/go-agent-harness/go-llm-gateway, desc: audio primitives remain independent of orchestration and host adapters}
        gateway-functional-tests:
          # Lax: only the deny entry is checked, and the longer allow entry
          # re-admits the shared message contract.
          list-mode: lax
          files: ["${config-path}/go-llm-gateway/test/functional/*.go"]
          allow:
            - "github.com/portpowered/go-agent-harness/go-agent-loop/pkg/messages$"
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-loop, desc: the gateway consumer proof depends on the loop only through the shared message contract}
        session-contract:
          files: ["${config-path}/agent-cli/internal/services/agentsession/interface.go"]
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/go-device-gateway, desc: the public session contract stays independent of concrete device and provider gateways}
            - {pkg: github.com/portpowered/go-agent-harness/go-llm-gateway, desc: the public session contract stays independent of concrete device and provider gateways}
        device-contract:
          files:
            - "${config-path}/agent-cli/internal/services/devices/interface.go"
            - "${config-path}/agent-cli/internal/transport/cli/devices.go"
            - "${config-path}/agent-cli/internal/transport/cli/probe.go"
            - "${config-path}/agent-cli/internal/transport/cli/probe_output.go"
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/go-device-gateway, desc: the device contract and the device list/probe transports reach devices only through the public device service}
        agent-cli-production:
          files: ["${config-path}/agent-cli/internal/**", "!$test"]
          deny:
            - {pkg: github.com/portpowered/go-agent-harness/agent-cli/internal/audio, desc: application code reaches audio payloads through go-audio}
            - {pkg: github.com/portpowered/go-agent-harness/go-llm-gateway/pkg/wavio, desc: application code reaches audio payloads through go-audio}
            - {pkg: github.com/portpowered/go-agent-harness/go-agent-loop/pkg/platform/clock, desc: application code takes clocks from go-audio}
        agent-cli-binary:
          files:
            - "${config-path}/agent-cli/internal/**"
            - "!$test"
            - "!${config-path}/agent-cli/internal/webmcp/testkit/**"
          deny:
            - {pkg: "encoding/binary$", desc: application code does not parse audio payload bytes; browser testkit binary identifiers are the reviewed exception}
    forbidigo:
      # Patterns match the resolved package path and receiver type, so an
      # aliased import or a method value cannot hide a call.
      analyze-types: true
      forbid:
        - pattern: '^os\.Getwd$'
          msg: inject the working directory through a host boundary
        - pattern: '^os\.UserHomeDir$'
          msg: inject host directories through a boundary
        - pattern: '^fmt\.(Print|Printf|Println)$'
          msg: return diagnostics through an injected writer or typed result
        - pattern: '^time\.Sleep$'
          msg: wait on a signal, a fake clock, or testing/synctest
        - pattern: '^context\.(Background|TODO)$'
          msg: accept a context from the caller (roots belong in main/cmd and test setup)
        - pattern: '^panic$'
          msg: return an error (panics belong only in must-style init of constant inputs, documented with nolint)
        # With analyze-types a call through testing.TB resolves to
        # testing.TB.Skip*, and through *testing.F to testing.F.Skip*, so both
        # are listed next to T and B.
        - pattern: '^testing\.(common|T|B|TB|F)\.(Skip|Skipf|SkipNow)$'
          msg: never skip; use build tags or constraints to select where a test runs
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # Generated code (for example Wire's wire_gen.go, which `make wire-check`
    # keeps in sync with its injector) is excluded. strict: only a file whose
    # header is the standard `// Code generated ... DO NOT EDIT.` line counts,
    # so a hand-written "do not edit" or "autogenerated" comment cannot hide a
    # file from every linter.
    generated: strict
    rules:
      # Roots for contexts and panics are legitimate in entrypoints and tests.
      - path: '(^|/)(cmd/|main\.go$)'
        linters: [forbidigo]
        text: 'context\.(Background|TODO)|panic'
      - path: '_test\.go$'
        linters: [forbidigo]
        text: 'context\.(Background|TODO)|panic'
      # time.Sleep is forbidden by default; device polling backends may
      # justify it with a specific nolint explanation.
      # ---- TEMPORARY round-3 exclusions (only shrink; see lint-policy.md) ----
      # Each entry lists only linters that had findings in its path. The
      # nolintlint companion rule keeps existing //nolint directives for an
      # excluded linter from being reported as unused while the exclusion
      # exists; remove it together with the linter.
