version: "2"

# The single, hard lint policy. Every linter below applies to ALL code in
# every LINT_MODULES module (production and tests, every build tag and
# platform lane) and any finding fails `make lint`. There is no new-code-only
# pass, no new-from-rev filter and no baseline. The only exceptions are the
# documented permanent exclusions and the temporary round-3 exclusions at the
# end of this file, which the per-module lint tracks remove.
# See docs/architecture/lint-policy.md.

run:
  # golangci-lint runs once per module directory. Report and match paths
  # relative to the repository root (e.g. agent-cli/internal/...) so that
  # exclusion rules can name a module.
  relative-path-mode: gitroot
  # Tests follow the same policy as production. The architecture gate
  # separately keeps the stronger physical test budgets.
  tests: true
  # Opt-in build tags are linted with the same limits as default-tag code.
  # e2e_internal files depend on live helpers, so the tags load together.
  # wireinject is linted in a separate pass (it swaps out !wireinject files);
  # see `make lint-wireinject`.
  build-tags:
    - live
    - e2e
    - e2e_internal
    - stress
    - sessioncapacityramp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report every linter on a line (e.g. funlen and gocognit on one function).
  uniq-by-line: false

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Size and complexity.
    - funlen
    - gocyclo
    - gocognit
    - revive
    - nestif
    - dupl
    # Correctness and error flow.
    - nilerr
    - nilnesserr
    - bodyclose
    - durationcheck
    - errorlint
    - contextcheck
    - containedctx
    - noctx
    - fatcontext
    - gocritic
    - gosec
    - makezero
    - reassign
    - asasalint
    - bidichk
    - wastedassign
    - unparam
    - recvcheck
    - errname
    - predeclared
    - iface
    # Policy values and finite state.
    - goconst
    - mnd
    - exhaustive
    # Package state, prohibited effects, suppression hygiene.
    - gochecknoglobals
    - gochecknoinits
    - forbidigo
    - depguard
    - nolintlint
    - godox
    # Modern/std idioms.
    - exptostd
    - canonicalheader
    - usestdlibvars
    - mirror
    - copyloopvar
    - intrange
    - misspell
    - nakedret
    # Tests.
    - testifylint
    - usetesting
    - tparallel
    - thelper

  settings:
    funlen:
      lines: 100
      statements: -1
      ignore-comments: false
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 5
    dupl:
      threshold: 150
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skip-comments: false
              skip-blank-lines: false
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Win32 procedure calls always return a non-nil GetLastError value; the
      # primary return value carries success, so callers check that instead.
      exclude-functions:
        - (*syscall.LazyProc).Call
        - (*syscall.Proc).Call
        - syscall.SyscallN
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      check:
        - switch
      # A default branch must not silently hide a newly added enum member.
      default-signifies-exhaustive: false
      package-scope-only: true
    goconst:
      min-len: 4
      min-occurrences: 3
      match-constant: true
      numbers: false
      ignore-calls: true
    mnd:
      checks: [argument, case, condition, operation, return, assign]
      # Language and wire protocol sentinels are intentionally readable as
      # literals. Meaningful policy values still require named constants.
      ignored-numbers: ["0", "1", "2", "10", "100", "255"]
    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks: [ifElseChain, singleCaseSwitch, elseif, captLocal, assignOp, unlambda, commentedOutCode, uncheckedInlineErr, evalOrder]
    gosec:
      includes: [G110, G112, G114, G201, G202, G203, G402, G403, G501, G502, G503, G504, G505, G601]
    iface:
      enable: [identical, unused]
      settings:
        unused:
          # go-agent-runtime/services/<name> are the runtime's public contract
          # packages: they declare the role interfaces that wire packages,
          # agent-cli and external embedders implement and consume, so use
          # inside the declaring package is not expected. Implementation
          # packages (internal/**) stay under the unused check.
          exclude:
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/audioio
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/browserconversation
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/devices
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/providers
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/recording
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/replay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/roomevidence
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/roomreplay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/rooms
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/rtctransport
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/selfplay
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/session
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessionduration
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessiontrace
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/sessionturn
            - github.com/portpowered/go-agent-harness/go-agent-runtime/services/tools
    recvcheck:
      # encoding/json and encoding.TextUnmarshaler require pointer-receiver
      # decoders while encoders stay on value receivers (so values marshal);
      # the builtin exclusions already cover the Marshal* half.
      exclusions: ["*.UnmarshalJSON", "*.UnmarshalText"]
    godox:
      keywords: [FIXME, HACK, XXX, BUG, TODO]
    depguard:
      rules:
        deprecated:
          files: ["$all"]
          deny:
            - {pkg: io/ioutil, desc: use io and os}
            - {pkg: "math/rand$", desc: use math/rand/v2}
            - {pkg: github.com/pkg/errors, desc: use errors and fmt.Errorf with %w}
        library-logging:
          files: ["$all", "!$test", "!**/cmd/**", "!**/main.go"]
          deny:
            - {pkg: "log$", desc: inject a logger; library code must not write to the global log}
    forbidigo:
      # Patterns match the resolved package path and receiver type, so an
      # aliased import or a method value cannot hide a call.
      analyze-types: true
      forbid:
        - pattern: '^os\.Getwd$'
          msg: inject the working directory through a host boundary
        - pattern: '^os\.UserHomeDir$'
          msg: inject host directories through a boundary
        - pattern: '^fmt\.(Print|Printf|Println)$'
          msg: return diagnostics through an injected writer or typed result
        - pattern: '^time\.Sleep$'
          msg: wait on a signal, a fake clock, or testing/synctest
        - pattern: '^context\.(Background|TODO)$'
          msg: accept a context from the caller (roots belong in main/cmd and test setup)
        - pattern: '^panic$'
          msg: return an error (panics belong only in must-style init of constant inputs, documented with nolint)
        # With analyze-types a call through testing.TB resolves to
        # testing.TB.Skip*, and through *testing.F to testing.F.Skip*, so both
        # are listed next to T and B.
        - pattern: '^testing\.(common|T|B|TB|F)\.(Skip|Skipf|SkipNow)$'
          msg: never skip; use build tags or constraints to select where a test runs
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # Generated code (for example Wire's wire_gen.go, which `make wire-check`
    # keeps in sync with its injector) is excluded.
    generated: lax
    rules:
      # Roots for contexts and panics are legitimate in entrypoints and tests.
      - path: '(^|/)(cmd/|main\.go$)'
        linters: [forbidigo]
        text: 'context\.(Background|TODO)|panic'
      - path: '_test\.go$'
        linters: [forbidigo]
        text: 'context\.(Background|TODO)|panic'
      # time.Sleep is forbidden by default; device polling backends may
      # justify it with a specific nolint explanation.
      # ---- TEMPORARY round-3 exclusions (only shrink; see lint-policy.md) ----
      # Each entry lists only linters that had findings in its path. The
      # nolintlint companion rule keeps existing //nolint directives for an
      # excluded linter from being reported as unused while the exclusion
      # exists; remove it together with the linter.
      # owned by session-wrappers
      - path: '^go-agent-loop/pkg/messages/session\.go$'
        linters: [iface]
      - path: '^go-agent-loop/pkg/messages/session\.go$'
        linters: [nolintlint]
        text: 'is unused for linter "(iface)"'
      # owned by session-wrappers
      - path: '^go-agent-runtime/services/devices/internal/rtc/binding_transport\.go$'
        linters: [containedctx, forbidigo]
      - path: '^go-agent-runtime/services/devices/internal/rtc/binding_transport\.go$'
        linters: [nolintlint]
        text: 'is unused for linter "(containedctx|forbidigo)"'
      # owned by session-wrappers
      - path: '^go-agent-runtime/services/session/internal/live/sessionwrap/'
        linters: [nestif]
      - path: '^go-agent-runtime/services/session/internal/live/sessionwrap/'
        linters: [nolintlint]
        text: 'is unused for linter "(nestif)"'
      # owned by session-wrappers
      - path: '^go-agent-runtime/services/sessionduration/internal/service/admission(_forward)?\.go$'
        linters: [forbidigo]
      - path: '^go-agent-runtime/services/sessionduration/internal/service/admission(_forward)?\.go$'
        linters: [nolintlint]
        text: 'is unused for linter "(forbidigo)"'
      # owned by session-wrappers
      - path: '^go-llm-gateway/pkg/testing/session_record\.go$'
        linters: [containedctx, forbidigo, mnd]
      - path: '^go-llm-gateway/pkg/testing/session_record\.go$'
        linters: [nolintlint]
        text: 'is unused for linter "(containedctx|forbidigo|mnd)"'
      # round-3 cleanup: lint-agent-cli track
      - path: '^agent-cli/'
        linters: [containedctx, contextcheck, copyloopvar, dupl, errname, errorlint, exhaustive, fatcontext, forbidigo, gochecknoglobals, gocritic, godox, gosec, iface, intrange, mirror, mnd, nestif, nilnesserr, noctx, predeclared, recvcheck, thelper, tparallel, unparam, usestdlibvars, usetesting, wastedassign]
      - path: '^agent-cli/'
        linters: [nolintlint]
        text: 'is unused for linter "(containedctx|contextcheck|copyloopvar|dupl|errname|errorlint|exhaustive|fatcontext|forbidigo|gochecknoglobals|gocritic|godox|gosec|iface|intrange|mirror|mnd|nestif|nilnesserr|noctx|predeclared|recvcheck|thelper|tparallel|unparam|usestdlibvars|usetesting|wastedassign)"'
