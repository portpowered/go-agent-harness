version: "2"

# Hard lint policy. Every finding here fails `make lint` for ALL code in every
# LINT_MODULES module: there is no new-from-rev filter and no legacy baseline.
# Linters that still carry legacy debt run on new code only through
# .golangci.new.yml, which `make lint` runs as a second pass.
# See docs/architecture/lint-policy.md.

run:
  # Tests follow the same limits and error/context/suppression policy as
  # production. The architecture gate separately keeps the stronger physical
  # test budgets.
  tests: true
  # Opt-in build tags are linted with the same limits as default-tag code.
  # e2e_internal files depend on live helpers, so the tags load together.
  # wireinject is linted in a separate pass (it swaps out !wireinject files);
  # see `make lint-wireinject`.
  build-tags:
    - live
    - e2e
    - e2e_internal
    - stress
    - sessioncapacityramp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report every linter on a line (e.g. funlen and gocognit on one function).
  uniq-by-line: false

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Size and complexity limits.
    - funlen
    - gocyclo
    - gocognit
    - revive

    # Correctness and error-flow checks.
    - nilerr
    - bodyclose
    - durationcheck

    # Policy values.
    - goconst

    # Package state, prohibited effects, and suppression hygiene.
    - gochecknoinits
    - nolintlint

  settings:
    funlen:
      lines: 100
      statements: -1
      ignore-comments: false
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skip-comments: false
              skip-blank-lines: false
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Win32 procedure calls always return a non-nil GetLastError value; the
      # primary return value carries success, so callers check that instead.
      exclude-functions:
        - (*syscall.LazyProc).Call
        - (*syscall.Proc).Call
        - syscall.SyscallN
    goconst:
      min-len: 4
      min-occurrences: 3
      match-constant: true
      numbers: false
      ignore-calls: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
