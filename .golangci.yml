version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - funlen
    - gocognit
    - revive

  settings:
    funlen:
      lines: 296
      statements: -1
      ignore-comments: false
    gocognit:
      min-complexity: 99
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1164
              skip-comments: false
              skip-blank-lines: false
